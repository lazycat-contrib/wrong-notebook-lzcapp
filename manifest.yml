application:
  subdomain: wrong-notebook
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://wrong-notebook:3000/
services:
  wrong-notebook:
    # ghcr.io/wttwins/wrong-notebook:1.9.1
    # upstream: ghcr.io/wttwins/wrong-notebook:2.2.0
    image: registry.lazycat.cloud/czyt/wttwins/wrong-notebook:f9c4c6cf51617c53
    user: root
    environment:
      - NEXTAUTH_URL=https://{{.S.AppDomain}}
      - NEXTAUTH_SECRET={{ stable_secret "w#notebook" }}
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/config:/app/config
